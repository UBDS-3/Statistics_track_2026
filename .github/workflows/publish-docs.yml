name: Publish docs
on:
  push:
    branches: [main]
    paths: ['labs/**/*.qmd']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-GGally-ggplot2-pheatmap-factoextra-ade4

      - name: Install R packages
        run: Rscript -e 'install.packages(c("GGally","ggplot2","pheatmap","factoextra","ade4"))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render public docs
        run: ./render.sh --type public --lab multivariate

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- docs || (git add docs && git commit -m "Publish docs [skip ci]" && git push)

name: Publish docs
on:
  push:
    branches: [main]
    paths: ['labs/**/*.qmd']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # any:: = CRAN, bioc:: = Bioconductor. pak resolves both and
          # installs required Ubuntu system libraries automatically.
          packages: |
            any::GGally
            any::ggplot2
            any::pheatmap
            any::factoextra
            any::ade4
            any::readr
            any::here
            any::dplyr
            any::tidyr
            any::tibble
            any::skimr
            any::DataExplorer
            any::naniar
            any::summarytools
            bioc::SummarizedExperiment
            bioc::DESeq2
            bioc::plyranges
            bioc::nullranges
            bioc::plyxp
            bioc::tidySummarizedExperiment
            bioc::iSEE

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render public docs
        run: ./render.sh --type public --lab multivariate exploratory

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- docs || (git add docs && git commit -m "Publish docs [skip ci]" && git push)
